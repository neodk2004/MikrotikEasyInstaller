name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Passe dieses Label an, falls dein Runner unter einem anderen Namen registriert ist
    # (in Gitea unter Repository/Organisation -> Einstellungen -> Actions -> Runner sichtbar).
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Debug, nicht Release: der interne Demo-Verbindungszugang, den ein Teil der Tests nutzt,
      # existiert per #if DEBUG nur in Debug-Builds (siehe RouterOsClientFactory.cs) — in Release
      # würde der Test einen echten Verbindungsversuch auslösen und in einen Timeout laufen.
      - name: Tests ausführen
        run: dotnet test src/MikrotikInstaller.Core.Tests/MikrotikInstaller.Core.Tests.csproj --configuration Debug

      - name: Windows-exe veröffentlichen (self-contained, Single-File)
        run: dotnet publish src/MikrotikInstaller.App/MikrotikInstaller.App.csproj --configuration Release --runtime win-x64

      - name: Build-Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Installer-windows-x64
          path: src/MikrotikInstaller.App/bin/Release/net8.0-windows/win-x64/publish/MikroTik-Installer.exe
